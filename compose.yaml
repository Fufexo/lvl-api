# Local database. `./mvnw spring-boot:run` starts it automatically (spring-boot-docker-compose).
services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=lvl'
      - 'POSTGRES_USER=lvl'
      - 'POSTGRES_PASSWORD=lvl'
    ports:
      - '5432'
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<version>.
      - 'lvl-pg18:/var/lib/postgresql'

volumes:
  lvl-pg18:
